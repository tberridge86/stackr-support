name: Build Pokemon magazine offline cover pack

on:
  push:
    branches:
      - pokemon-magazine-offline-pack-20260906

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Download real cover thumbnails
        run: |
          cat > /tmp/build_pack.py <<'PY'
          import io, time, urllib.parse
          from pathlib import Path
          from datetime import date
          import requests
          from PIL import Image, ImageOps

          CORO = '''
