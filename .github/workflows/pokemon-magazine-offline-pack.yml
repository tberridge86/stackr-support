          https://corocoro-news.jp/wp-content/uploads/2018/12/c3a7608b995a0132f528f765ba566fe1.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/c344610cbb83e2d6181443783621f066.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/39b3b870873753e4dd5577a1c4260671.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/04406a8a3cc4dcb7d1008133e4cb17e1.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/7927cc93c8e013817e0764520fa74365.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/4c4eda5c3f8bd26a890749732c714f8d.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/73dd176bff1692cfa4ad5065fb4d6bc4.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/c6180936371feb6df509cc51cee402ce.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/21f0a36b04bd36e3bcd7bc30981c3709.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/dbfccdbeb581772979cae71f708fd63d.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/cfac597e5498e07ba7e2f768aa66cb55.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/e570b20bf55d1f17a242a5472f590a8c.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/e7c08812c35f2f69d18c1a16f7586002.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/4f4bc4600304f34c73903bf82211521b.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/e8b10ce8658c9d5fffb7011d9749586b.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/b1102e0df81aad7e84dbb91cbdbd9330.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/d1e731d4477bb0737ed93d1d2e5bceea.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/f432171d3083658d89cc8c2bf174fa63.jpg
          https://corocoro-news.jp/wp-content/uploads/2018/12/b154e251100f8ea47afe5e162ad6479c.jpg
          '''.split()

          RETRO_IDS = [61452,61458,61460,61456,61461,61462,61459,61453,61457,61455]
          DOGASU = [
            ('CoroCoro Ichiban','2021-06-CoroCoro-Ichiban.jpg','https://dogasu.bulbagarden.net/features/miscellaneous/magazines/corocoro_ichiban/corocoro_ichiban_small.png'),
            ('Pokemon Fan Japan','2021-Issue-73-Pokemon-Fan-Japan.jpg','https://dogasu.bulbagarden.net/features/miscellaneous/magazines/pokemon_fan/pokemon_fan_small.png'),
          ]

          root = Path('Pokemon_Magazine_Covers')
          root.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'})

          def get_image(url, referer):
              encoded = urllib.parse.quote(url, safe='')
              tries = [url, f'https://images.weserv.nl/?url={encoded}&w=900&output=jpg&q=90', f'https://wsrv.nl/?url={encoded}&w=900&output=jpg&q=90']
              errors=[]
              for u in tries:
                  for attempt in range(2):
                      try:
                          r=session.get(u,headers={'Referer':referer},timeout=30,allow_redirects=True)
                          if r.ok and len(r.content)>1800:
                              im=Image.open(io.BytesIO(r.content)); im.load()
                              return im
                          errors.append(f'{r.status_code}:{len(r.content)}:{r.headers.get("content-type")}')
                      except Exception as e:
                          errors.append(type(e).__name__+':'+str(e)[:80])
                      time.sleep(1+attempt)
              raise RuntimeError(' | '.join(errors[-6:]))

          def save(url, folder, filename, referer):
              out=root/folder/filename
              out.parent.mkdir(parents=True,exist_ok=True)
              im=get_image(url,referer)
              im=ImageOps.exif_transpose(im)
              if im.mode!='RGB':
                  if 'A' in im.getbands():
                      bg=Image.new('RGB',im.size,'white'); bg.paste(im,mask=im.getchannel('A')); im=bg
                  else: im=im.convert('RGB')
              im.thumbnail((700,900),Image.Resampling.LANCZOS)
              im.save(out,'JPEG',quality=88,optimize=True,progressive=True)
              with Image.open(out) as check: check.verify()
              print('OK',out,im.size)

          failed=[]
          # 69 consecutive monthly CoroCoro issues: 1996-04 through 2001-12.
          y,m=1996,4
          for i,url in enumerate(CORO):
              fn=f'{y:04d}-{m:02d}-CoroCoro-Comic.jpg'
              try: save(url,'CoroCoro Comic',fn,'https://corocoro-news.jp/')
              except Exception as e: failed.append((fn,url,str(e))); print('FAIL',fn,e)
              m+=1
              if m==13: y+=1; m=1

          for n,img_id in enumerate(RETRO_IDS,1):
              url=f'https://www.retromags.com/gallery/?img={img_id}&module=images&section=img_ctrl'
              fn=f'Pokemon-Fan-US-Issue-{n:02d}.jpg'
              try: save(url,'Pokemon Fan US',fn,'https://www.retromags.com/magazines/usa/pokemon-fan/')
              except Exception as e: failed.append((fn,url,str(e))); print('FAIL',fn,e)

          for folder,fn,url in DOGASU:
              try: save(url,folder,fn,'https://dogasu.bulbagarden.net/features/miscellaneous/magazine_guide.html')
              except Exception as e: failed.append((fn,url,str(e))); print('FAIL',fn,e)

          count=len(list(root.rglob('*.jpg')))
          print(f'ACTUAL JPG COUNT={count}; FAILURES={len(failed)}')
          if failed:
              for x in failed: print('FAILED_ITEM',*x,sep=' | ')
          if count != 81:
              raise SystemExit(f'Expected 81 actual JPG files, got {count}')
          PY
          python /tmp/build_pack.py

      - name: Verify offline image pack
        run: |
          test "$(find Pokemon_Magazine_Covers -type f -iname '*.jpg' | wc -l)" -eq 81
          test "$(find Pokemon_Magazine_Covers -type f ! -iname '*.jpg' | wc -l)" -eq 0
          du -sh Pokemon_Magazine_Covers

      - name: Upload actual offline cover images
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Magazine_Covers_OFFLINE
          path: Pokemon_Magazine_Covers/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
